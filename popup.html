<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: sans-serif;
        width: 220px;
        height: 440px;
        padding: 1px;
      }

      h3 {
      font-size: 20px;
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      }

      .course-row {
        margin-bottom: 12px;
      }

      .course-title {
        font-size: 14px;
        font-weight: 600;
      }

      .course-grade {
        font-size:20px;
        font-weight: 700;
        margin-top: 2px;
      }

      .course-delete {
        font-weight: 400;
        margin-left: 180px;
        background: none;
        border: none;
        cursor: pointer;
        opacity: 0.5;
      }
      
      .course-delete svg {
        fill: #664
      }

      .course-delete:hover svg {
        fill: #d20c0c;
        opacity: 1;
      }

    </style>
  <head>
<body>
  <h3>BrightView</h3>
  <div id="courses"></div>
  <script src="popup.js"></script>
</body>
</html>
